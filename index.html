const projects = [
  { emoji: "🎬", title: "Magnetic Fields", subtitle: "A Scripted Web Series",
    desc: "A group of young people discover a strange new material while visiting a research center. What happens when they steal it? Four episodes of real science wrapped in a story you'll actually want to binge.",
    link: "https://mediaspace.illinois.edu/media/t/0_da1d4ekg", linkText: "Watch the series", tag: "VIDEO SERIES" },
  { emoji: "\ud83d\udc83", title: "Graphene Has My Heart", subtitle: "A Dua Lipa Parody by Scientists",
    desc: "MRSEC researchers made a music video parody about graphene and 2D materials. The honeycomb lattice never sounded so catchy.",
    link: "https://development.web.illinois.edu/science-music-video", linkText: "Watch + behind the scenes", tag: "MUSIC VIDEO" },
  { emoji: "\ud83d\udd0a", title: "Build Your Own Speaker Kit", subtitle: "3D-Printed + Free Resources",
    desc: "A hands-on kit that teaches magnetism and the physics of sound by building an actual working speaker. All files and instructions are free to download.",
    link: "https://drive.google.com/drive/folders/11c_r1oV5MEa9QI4zA54F_TbTNotfkxE1", linkText: "Get the kit (free)", tag: "DIY KIT" }
];

const boothOptions = [
  { label: "Loved it!", emoji: "\ud83e\udd29", value: 5 },
  { label: "Pretty cool", emoji: "\ud83d\ude0a", value: 4 },
  { label: "It was okay", emoji: "\ud83d\ude42", value: 3 },
  { label: "Meh", emoji: "\ud83d\ude10", value: 2 }
];

const roleOptions = ["Current student","Prospective student","Parent / Family","Faculty / Staff","Community member","Just passing through"];

function App() {
  const [faves, setFaves] = useState([]);
  const [rating, setRating] = useState(null);
  const [role, setRole] = useState("");
  const [comment, setComment] = useState("");
  const [submitted, setSubmitted] = useState(false);
  const [showSurvey, setShowSurvey] = useState(false);
  const surveyRef = useRef(null);

  const toggleFave = (t) => setFaves(p => p.includes(t) ? p.filter(x => x !== t) : [...p, t]);

  const scrollDown = () => {
    setShowSurvey(true);
    setTimeout(() => surveyRef.current?.scrollIntoView({ behavior: "smooth" }), 100);
  };

  const handleSubmit = () => {
    const body = new URLSearchParams({
      "form-name": "eoh-feedback",
      faveProjects: faves.join(", "),
      boothRating: String(rating || ""),
      role: role,
      comment: comment,
      timestamp: new Date().toISOString()
    });
    fetch("/", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body.toString() })
      .then(() => setSubmitted(true))
      .catch(() => setSubmitted(true));
  };

  const Chip = ({ selected, onClick, children, accent }) => {
    const c = accent || ORANGE;
    return (
      <button onClick={onClick} style={{
        padding: "8px 14px", borderRadius: 50, fontSize: 13, fontWeight: 600,
        border: "2px solid " + (selected ? c : "#ddd"),
        background: selected ? c + "14" : "#fff",
        color: selected ? c : "#666", transition: "all 0.15s"
      }}>{children}</button>
    );
  };

  return (
    <div style={{ minHeight: "100vh" }}>
      {/* HERO */}
      <div style={{ background: "linear-gradient(135deg, " + NAVY + " 0%, #1a3a6a 100%)", padding: "48px 24px 56px", textAlign: "center", position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", top: -60, right: -60, width: 200, height: 200, borderRadius: "50%", background: ORANGE, opacity: 0.12 }} />
        <div style={{ position: "absolute", bottom: -40, left: -40, width: 150, height: 150, borderRadius: "50%", background: ORANGE, opacity: 0.08 }} />
        <div style={{ position: "relative", zIndex: 1 }}>
          <div style={{ fontSize: 13, letterSpacing: 3, color: ORANGE, fontWeight: 700, fontFamily: "'Syne', sans-serif", marginBottom: 12, textTransform: "uppercase" }}>
            Illinois MRSEC · Engineering Open House
          </div>
          <h1 style={{ fontFamily: "'Syne', sans-serif", fontSize: "clamp(28px, 7vw, 44px)", fontWeight: 800, color: "#fff", lineHeight: 1.15, margin: "0 0 16px" }}>
            You just visited<br/>something <span style={{ color: ORANGE }}>special.</span>
          </h1>
          <p style={{ color: "rgba(255,255,255,0.7)", fontSize: 16, maxWidth: 420, margin: "0 auto", lineHeight: 1.6 }}>
            But did you know I-MRSEC also produced a web series, a music video, and a DIY speaker kit?
            Scroll to explore what the center has been up to!
          </p>
        </div>
      </div>

      {/* PROJECTS */}
      <div style={{ padding: "40px 20px 24px", maxWidth: 560, margin: "0 auto" }}>
        <div style={{ fontSize: 12, letterSpacing: 2.5, color: ORANGE, fontWeight: 700, fontFamily: "'Syne', sans-serif", marginBottom: 8, textTransform: "uppercase" }}>Our Greatest Hits</div>
        <h2 style={{ fontFamily: "'Syne', sans-serif", fontSize: 26, fontWeight: 700, margin: "0 0 28px", lineHeight: 1.2 }}>
          Science that's actually<br/>fun to watch.
        </h2>
        {projects.map((p, i) => (
          <div key={i} style={{ background: "#fff", borderRadius: 16, padding: "24px 20px", marginBottom: 16, boxShadow: "0 2px 12px rgba(0,0,0,0.06)", border: "1px solid rgba(0,0,0,0.04)" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
              <span style={{ fontSize: 28 }}>{p.emoji}</span>
              <span style={{ fontSize: 10, letterSpacing: 1.5, fontWeight: 700, color: ORANGE, background: ORANGE + "12", padding: "3px 8px", borderRadius: 4 }}>{p.tag}</span>
            </div>
            <h3 style={{ fontFamily: "'Syne', sans-serif", fontSize: 20, fontWeight: 700, margin: "0 0 2px" }}>{p.title}</h3>
            <div style={{ fontSize: 13, color: "#888", fontWeight: 500, marginBottom: 10 }}>{p.subtitle}</div>
            <p style={{ fontSize: 14, lineHeight: 1.6, color: "#444", margin: "0 0 14px" }}>{p.desc}</p>
            <a href={p.link} target="_blank" rel="noopener noreferrer" style={{ display: "inline-flex", alignItems: "center", gap: 6, color: ORANGE, fontSize: 14, fontWeight: 600, textDecoration: "none" }}>
              {p.linkText} <span style={{ fontSize: 18 }}>→</span>
            </a>
          </div>
        ))}
      </div>

      {/* PHOTOS */}
      <div style={{ padding: "16px 20px 32px", maxWidth: 560, margin: "0 auto" }}>
        <div style={{ fontSize: 12, letterSpacing: 2.5, color: ORANGE, fontWeight: 700, fontFamily: "'Syne', sans-serif", marginBottom: 12, textTransform: "uppercase" }}>In Action</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          {PHOTOS.map((ph, i) => (
            <div key={i} style={{ borderRadius: 12, overflow: "hidden", position: "relative", aspectRatio: "4/3" }}>
              <img src={ph.src} alt={ph.label} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
              <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, padding: "20px 10px 8px", background: "linear-gradient(transparent, rgba(0,0,0,0.6))", color: "#fff", fontSize: 12, fontWeight: 600 }}>{ph.label}</div>
            </div>
          ))}
        </div>
      </div>

      {/* CTA */}
      {!showSurvey && !submitted && (
        <div style={{ padding: "8px 20px 40px", textAlign: "center", maxWidth: 560, margin: "0 auto" }}>
          <div style={{ background: "linear-gradient(135deg, " + ORANGE + ", #ff6a3d)", borderRadius: 16, padding: "36px 24px", color: "#fff" }}>
            <h2 style={{ fontFamily: "'Syne', sans-serif", fontSize: 22, fontWeight: 700, margin: "0 0 10px" }}>Alright, your turn.</h2>
            <p style={{ fontSize: 14, opacity: 0.9, margin: "0 0 20px", lineHeight: 1.5 }}>Tell us what caught your eye and how the booth was — takes 30 seconds.</p>
            <button onClick={scrollDown} style={{ background: "#fff", color: ORANGE, border: "none", borderRadius: 50, padding: "14px 32px", fontSize: 15, fontWeight: 700, fontFamily: "'Syne', sans-serif", boxShadow: "0 4px 16px rgba(0,0,0,0.15)" }}>
              Let's go ↓
            </button>
          </div>
        </div>
      )}

      {/* SURVEY */}
      {showSurvey && !submitted && (
        <div ref={surveyRef} style={{ padding: "0 20px 60px", maxWidth: 560, margin: "0 auto" }}>
          <div style={{ background: "#fff", borderRadius: 20, padding: "32px 22px", boxShadow: "0 4px 24px rgba(0,0,0,0.08)" }}>
            <div style={{ marginBottom: 28 }}>
              <div style={{ fontSize: 11, letterSpacing: 2, color: ORANGE, fontWeight: 700, marginBottom: 6 }}>QUESTION 1</div>
              <h3 style={{ fontFamily: "'Syne', sans-serif", fontSize: 18, fontWeight: 700, margin: "0 0 14px" }}>Which of these projects caught your eye?</h3>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                {projects.map(p => <Chip key={p.title} selected={faves.includes(p.title)} onClick={() => toggleFave(p.title)}>{p.emoji} {p.title}</Chip>)}
              </div>
            </div>
            <div style={{ marginBottom: 28 }}>
              <div style={{ fontSize: 11, letterSpacing: 2, color: ORANGE, fontWeight: 700, marginBottom: 6 }}>QUESTION 2</div>
              <h3 style={{ fontFamily: "'Syne', sans-serif", fontSize: 18, fontWeight: 700, margin: "0 0 14px" }}>How was the booth experience?</h3>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {boothOptions.map(q => (
                  <Chip key={q.value} selected={rating === q.value} onClick={() => setRating(q.value)}>
                    <span style={{ fontSize: 20, marginRight: 4 }}>{q.emoji}</span> {q.label}
                  </Chip>
                ))}
              </div>
            </div>
            <div style={{ marginBottom: 28 }}>
              <div style={{ fontSize: 11, letterSpacing: 2, color: ORANGE, fontWeight: 700, marginBottom: 6 }}>QUESTION 3</div>
              <h3 style={{ fontFamily: "'Syne', sans-serif", fontSize: 18, fontWeight: 700, margin: "0 0 14px" }}>What brought you to EOH?</h3>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                {roleOptions.map(r => <Chip key={r} selected={role === r} onClick={() => setRole(r)} accent={NAVY}>{r}</Chip>)}
              </div>
            </div>
            <div style={{ marginBottom: 28 }}>
              <div style={{ fontSize: 11, letterSpacing: 2, color: ORANGE, fontWeight: 700, marginBottom: 6 }}>BONUS</div>
              <h3 style={{ fontFamily: "'Syne', sans-serif", fontSize: 18, fontWeight: 700, margin: "0 0 14px" }}>Anything you wanna tell us?</h3>
              <textarea value={comment} onChange={e => setComment(e.target.value)} placeholder="Ideas, vibes, feedback — all welcome..."
                rows={3} style={{ width: "100%", boxSizing: "border-box", padding: "12px 14px", borderRadius: 12, border: "2px solid #e0e0e0", fontSize: 14, fontFamily: "'DM Sans', sans-serif", resize: "vertical" }} />
            </div>
            <button onClick={handleSubmit} style={{ width: "100%", padding: "16px", borderRadius: 14, border: "none", background: "linear-gradient(135deg, " + ORANGE + ", #ff6a3d)", color: "#fff", fontSize: 16, fontWeight: 700, fontFamily: "'Syne', sans-serif", boxShadow: "0 4px 16px rgba(232,74,39,0.3)" }}>
              Submit ✨
            </button>
          </div>
        </div>
      )}

      {/* THANK YOU */}
      {submitted && (
        <div style={{ padding: "40px 20px 80px", maxWidth: 560, margin: "0 auto", textAlign: "center" }}>
          <div style={{ background: "linear-gradient(135deg, " + NAVY + ", #1a3a6a)", borderRadius: 20, padding: "48px 28px", color: "#fff" }}>
            <div style={{ fontSize: 52, marginBottom: 16 }}>🎉</div>
            <h2 style={{ fontFamily: "'Syne', sans-serif", fontSize: 26, fontWeight: 800, margin: "0 0 12px" }}>Thanks a ton!</h2>
